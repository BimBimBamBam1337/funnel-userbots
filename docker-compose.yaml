services:
  app:
    build:
      context: ./
      dockerfile: Dockerfile
    environment:
      - TOKEN=${TOKEN}
      - POSTGRES_URL=postgresql+asyncpg://${DB_USER}:${DB_PASS}@postgres:5432/${DB_NAME}
      - REDIS_URL=redis://:${REDIS_PASS}@redis:6379/0
    depends_on:
      - postgres
    volumes:
      - .:/app
    networks:
      - network
    command: poetry run python main.py
    tty: true
    stdin_open: true

  postgres:
    image: postgres:17
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
      - POSTGRES_DB=${DB_NAME}
      - TZ=Europe/Moscow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - network
  redis:
    image: redis:7.2
    command: redis-server --requirepass ${REDIS_PASS}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

networks:
  network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
